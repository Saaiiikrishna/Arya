name: Deploy Complete Application to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  ACR_NAME: aryaprodacr
  RESOURCE_GROUP: arya-prod-rg
  LOCATION: centralindia

jobs:
  deploy-backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Container Apps Extension
        run: az extension add --name containerapp --upgrade

      - name: Ensure ACR Registry Exists
        run: |
          az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null || \
          az acr create --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }} --sku Basic --admin-enabled true

      - name: Get ACR Credentials
        id: acr-creds
        run: |
          ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          echo "::add-mask::${ACR_PASSWORD}"
          echo "acr_username=${ACR_USERNAME}" >> $GITHUB_OUTPUT
          echo "acr_password=${ACR_PASSWORD}" >> $GITHUB_OUTPUT

      - name: Run Prisma Migrations
        run: |
          cd backend
          npm ci
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed Database (idempotent upserts)
        run: |
          cd backend
          npx cross-env TS_NODE_PROJECT=tsconfig.seed.json npx ts-node -r tsconfig-paths/register prisma/seed.ts 2>&1 || {
            echo "::warning::Database seed failed — check output above. Deployment will continue."
          }
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Backend: Build & Deploy ──────────────────────────────────────
      - name: Build Backend Image in ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image arya-backend-api:${{ github.sha }} \
            --image arya-backend-api:latest \
            --platform linux/amd64 \
            ./backend

      - name: Deploy Backend Container App
        run: |
          ACR_SERVER=${{ env.ACR_NAME }}.azurecr.io
          IMAGE="${ACR_SERVER}/arya-backend-api:${{ github.sha }}"
          ACR_USER="${{ steps.acr-creds.outputs.acr_username }}"
          ACR_PASS="${{ steps.acr-creds.outputs.acr_password }}"

          # Check if container app exists
          if az containerapp show --name arya-backend-api --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            # Register ACR credentials with the existing container app
            az containerapp registry set \
              --name arya-backend-api \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server "${ACR_SERVER}" \
              --username "${ACR_USER}" \
              --password "${ACR_PASS}"

            az containerapp update \
              --name arya-backend-api \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars \
                "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
                "PRISMA_DATASOURCE_URL=${{ secrets.DATABASE_URL }}" \
                "REDIS_HOST=arya-prod-redis-cache.redis.cache.windows.net" \
                "REDIS_PORT=6380" \
                "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" \
                "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
                "JWT_EXPIRATION=15m" \
                "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" \
                "JWT_REFRESH_EXPIRATION=7d" \
                "AWS_REGION=ap-south-2" \
                "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
                "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
                "AWS_SES_FROM_EMAIL=no-reply@aryavartham.com" \
                "AWS_SES_FROM_NAME=Aryavartham" \
                "AWS_S3_BUCKET=arya-documents" \
                "NODE_ENV=production" \
                "PORT=3001" \
                "FRONTEND_URL=https://aryavartham.com" \
                "BATCH_CAPACITY=1000" \
                "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
                "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" \
                "RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
                "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
                "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          else
            az containerapp create \
              --name arya-backend-api \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment arya-backend-api-env \
              --image "$IMAGE" \
              --registry-server "${ACR_SERVER}" \
              --registry-username "${ACR_USER}" \
              --registry-password "${ACR_PASS}" \
              --ingress external \
              --target-port 3001 \
              --env-vars \
                "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
                "PRISMA_DATASOURCE_URL=${{ secrets.DATABASE_URL }}" \
                "REDIS_HOST=arya-prod-redis-cache.redis.cache.windows.net" \
                "REDIS_PORT=6380" \
                "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" \
                "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
                "JWT_EXPIRATION=15m" \
                "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" \
                "JWT_REFRESH_EXPIRATION=7d" \
                "AWS_REGION=ap-south-2" \
                "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
                "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
                "AWS_SES_FROM_EMAIL=no-reply@aryavartham.com" \
                "AWS_SES_FROM_NAME=Aryavartham" \
                "AWS_S3_BUCKET=arya-documents" \
                "NODE_ENV=production" \
                "PORT=3001" \
                "FRONTEND_URL=https://aryavartham.com" \
                "BATCH_CAPACITY=1000" \
                "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
                "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" \
                "RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
                "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
                "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          fi

      - name: Get Backend URL
        id: get-backend-url
        run: |
          BACKEND_FQDN=$(az containerapp show --name arya-backend-api --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "backend_url=https://$BACKEND_FQDN" >> $GITHUB_ENV

      # ── Frontend: Build & Deploy ─────────────────────────────────────
      - name: Prepare Frontend Environment
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ env.backend_url }}/api" > ./frontend/.env.production
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> ./frontend/.env.production

      - name: Build Frontend Image in ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image arya-frontend-web:${{ github.sha }} \
            --image arya-frontend-web:latest \
            --platform linux/amd64 \
            ./frontend

      - name: Deploy Frontend Container App
        run: |
          ACR_SERVER=${{ env.ACR_NAME }}.azurecr.io
          IMAGE="${ACR_SERVER}/arya-frontend-web:${{ github.sha }}"
          ACR_USER="${{ steps.acr-creds.outputs.acr_username }}"
          ACR_PASS="${{ steps.acr-creds.outputs.acr_password }}"

          if az containerapp show --name arya-frontend-web --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            # Register ACR credentials with the existing container app
            az containerapp registry set \
              --name arya-frontend-web \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server "${ACR_SERVER}" \
              --username "${ACR_USER}" \
              --password "${ACR_PASS}"

            az containerapp update \
              --name arya-frontend-web \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars "NEXT_PUBLIC_API_URL=${{ env.backend_url }}/api"
          else
            az containerapp create \
              --name arya-frontend-web \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment arya-backend-api-env \
              --image "$IMAGE" \
              --registry-server "${ACR_SERVER}" \
              --registry-username "${ACR_USER}" \
              --registry-password "${ACR_PASS}" \
              --ingress external \
              --target-port 3000 \
              --env-vars "NEXT_PUBLIC_API_URL=${{ env.backend_url }}/api"
          fi

      # ── Post-Deploy Configuration ───────────────────────────────────
      - name: Configure Scaling (min 1 replica to avoid cold starts)
        run: |
          az containerapp update --name arya-backend-api --resource-group ${{ env.RESOURCE_GROUP }} --min-replicas 1 --max-replicas 10
          az containerapp update --name arya-frontend-web --resource-group ${{ env.RESOURCE_GROUP }} --min-replicas 1 --max-replicas 10

      - name: Deactivate old revisions (keep only latest active)
        run: |
          # Deactivate all but the latest revision for backend
          LATEST_BACKEND=$(az containerapp show --name arya-backend-api --resource-group ${{ env.RESOURCE_GROUP }} --query properties.latestRevisionName -o tsv)
          for rev in $(az containerapp revision list --name arya-backend-api --resource-group ${{ env.RESOURCE_GROUP }} --query "[?name!='$LATEST_BACKEND'].name" -o tsv); do
            az containerapp revision deactivate --name arya-backend-api --resource-group ${{ env.RESOURCE_GROUP }} --revision "$rev" || true
          done
          # Deactivate all but the latest revision for frontend
          LATEST_FRONTEND=$(az containerapp show --name arya-frontend-web --resource-group ${{ env.RESOURCE_GROUP }} --query properties.latestRevisionName -o tsv)
          for rev in $(az containerapp revision list --name arya-frontend-web --resource-group ${{ env.RESOURCE_GROUP }} --query "[?name!='$LATEST_FRONTEND'].name" -o tsv); do
            az containerapp revision deactivate --name arya-frontend-web --resource-group ${{ env.RESOURCE_GROUP }} --revision "$rev" || true
          done

      - name: Configure Health Probes
        run: |
          az containerapp update --name arya-frontend-web --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars "HOSTNAME=0.0.0.0"
